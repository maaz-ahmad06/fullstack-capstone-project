version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: giftlink-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./giftlink-backend
    container_name: giftlink-backend
    restart: always
    ports:
      - "3060:3060"
    environment:
      - PORT=3060
      - MONGO_URL=mongodb://mongodb:27017/giftlinkdb
      - JWT_SECRET=giftlink_jwt_super_secret_key_2026
    depends_on:
      - mongodb

  frontend:
    build: ./giftlink-frontend
    container_name: giftlink-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
