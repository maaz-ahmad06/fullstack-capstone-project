name: GiftLink CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: giftlink-backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./giftlink-backend
        run: npm install

      - name: Run Backend Tests & Syntax Checks
        working-directory: ./giftlink-backend
        run: npm test

  frontend-checks:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: giftlink-frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./giftlink-frontend
        run: npm install

      - name: Build React Application
        working-directory: ./giftlink-frontend
        run: npm run build
